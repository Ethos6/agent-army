name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .
      - name: Unit tests (offline, no API keys)
        run: python -m unittest discover -s tests -v
      - name: Validate every template
        run: army validate
      - name: Generated README catalog and docs are up to date
        run: |
          army catalog --check
          army docs --check

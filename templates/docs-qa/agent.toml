name = "docs-qa"
title = "Docs Q&A Agent (RAG)"
category = "rag"
description = "Chat with any folder of docs. Every claim is cited to file:line, and it refuses when the answer isn't there."
example = "What is the refund window on the Pro plan?"

[[evals]]
input = "What is the refund window on the Pro plan?"
must_contain = ["30", "pricing.md"]
max_seconds = 120

[[evals]]
input = "Who is the CEO's favourite football team?"
must_contain = ["Not in the knowledge base"]
max_seconds = 120
